name: Development build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            extension: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            extension: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            extension: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare package name
        id: metadata
        shell: bash
        run: echo "package_name=opencode2api_dev_${GITHUB_SHA::7}_${{ matrix.goos }}_${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"
      - name: Build and package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: dev-${{ github.sha }}
          PACKAGE_NAME: ${{ steps.metadata.outputs.package_name }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          mkdir -p "dist/$PACKAGE_NAME"
          go build -trimpath -ldflags="-s -w -X main.version=$BUILD_VERSION" -o "dist/$PACKAGE_NAME/opencode2api$EXTENSION" ./cmd/opencode2api
          cp README.md README.zh-CN.md LICENSE config.example.json "dist/$PACKAGE_NAME/"
          cp -r docs "dist/$PACKAGE_NAME/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            (cd dist && zip -q -r "$PACKAGE_NAME.zip" "$PACKAGE_NAME")
            archive="$PACKAGE_NAME.zip"
          else
            tar -C dist -czf "dist/$PACKAGE_NAME.tar.gz" "$PACKAGE_NAME"
            archive="$PACKAGE_NAME.tar.gz"
          fi
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: |
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}
            dist/${{ steps.metadata.outputs.package_name }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 30

  container:
    name: Build and publish dev container
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
          build-args: |
            VERSION=dev-${{ github.sha }}
          cache-from: type=gha,scope=dev-container
          cache-to: type=gha,mode=max,scope=dev-container
          provenance: mode=max
          sbom: true
